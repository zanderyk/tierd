name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # The NFS and SMB specs mount shares from inside kind, and the NFS server
      # runs the kernel's nfsd; load the modules up front so a missing one
      # fails here, not as a hung mount.
      - name: Load NFS and SMB kernel modules
        run: sudo modprobe -a nfs nfsd cifs

      # make installs the pinned kind version into bin/.
      - name: Running Test e2e
        run: make test-e2e
