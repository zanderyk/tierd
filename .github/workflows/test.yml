name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # make test regenerates CRDs, RBAC and deepcopy code and runs go fmt;
      # the check below fails if any of that, or go.mod, wasn't committed.
      - name: Running Tests
        run: make test

      - name: Check generated files and go.mod are up to date
        run: |
          go mod tidy
          git diff --exit-code || {
            echo "::error::Generated files or go.mod are out of date: run 'go mod tidy' and 'make manifests generate fmt', then commit"
            exit 1
          }
