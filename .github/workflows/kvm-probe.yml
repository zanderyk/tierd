# Checks whether this repo's hosted runners can run KubeVirt VMs with KVM, to
# decide how a KubeVirt e2e job should run: with KVM, with useEmulation, or
# on a larger runner. The verdict is in the run's summary. Delete this
# workflow once that's decided.
name: KVM Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/kvm-probe.yml]

permissions: {}

jobs:
  probe:
    name: Probe for KVM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report CPU, memory and virtualization support
        run: |
          echo "CPUs: $(nproc)"
          free -g
          grep -m1 -owE 'vmx|svm' /proc/cpuinfo || echo "No vmx/svm CPU flag"
          ls -l /dev/kvm || echo "No /dev/kvm"

      # GitHub's documented rule for opening /dev/kvm to non-root users. In a
      # VM, QEMU runs as a non-root user, so KubeVirt needs this too.
      - name: Open /dev/kvm to all users
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # kind nodes are privileged containers, so this is what a kind node
      # sees. A non-root process opens the device, as QEMU would.
      - name: Check /dev/kvm from a kind-like container
        run: |
          {
            echo "## KVM probe"
            echo
            echo "- CPUs: $(nproc), memory: $(free -g | awk '/^Mem:/ {print $2}') GiB"
          } >> "$GITHUB_STEP_SUMMARY"
          if docker run --rm --privileged --user 107:107 alpine:3.22 \
            sh -c 'ls -l /dev/kvm && exec 3<>/dev/kvm'; then
            echo "- ✅ KVM is usable: run KubeVirt on kind with hardware virtualization" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ KVM is not usable: use KubeVirt's useEmulation, or a larger runner" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::KVM is not usable on this runner"
          fi
