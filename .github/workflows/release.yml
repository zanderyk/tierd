name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
    name: Build, smoke test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/tierd
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-compiles, so arm64 builds without emulation.
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build install.yaml
        run: make build-installer IMAGE_REPO="$IMAGE_REPO" IMG="$IMAGE_REPO:$GITHUB_REF_NAME"

      # Chart version is the tag without the "v"; appVersion is the image tag.
      - name: Package the Helm chart
        run: helm package helm/chart --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME" -d dist

      # Install the release on kind before publishing it. The image is loaded
      # into kind rather than pulled, since a new ghcr.io package is private
      # until it's made public.
      - name: Smoke test install.yaml on kind
        env:
          IMG: ${{ env.IMAGE_REPO }}:${{ github.ref_name }}
        run: |
          make setup-test-e2e
          export KUBECONFIG="$PWD/bin/e2e.kubeconfig"
          docker pull "$IMG"
          bin/kind load docker-image "$IMG" --name tierd-test-e2e
          kubectl apply -f dist/install.yaml
          kubectl -n tierd-system rollout status deployment/tierd-controller-manager --timeout=3m
          kubectl -n tierd-system rollout status daemonset/tierd-agent --timeout=3m
          kubectl apply --dry-run=server -k config/samples
          kubectl delete -f dist/install.yaml --wait

      - name: Smoke test the Helm chart on kind
        run: |
          export KUBECONFIG="$PWD/bin/e2e.kubeconfig"
          helm install tierd "dist/tierd-${GITHUB_REF_NAME#v}.tgz" \
            --namespace tierd-system --create-namespace --wait --timeout 3m
          kubectl -n tierd-system rollout status daemonset/tierd-agent --timeout=3m
          kubectl apply --dry-run=server -k config/samples

      - name: Push the Helm chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/tierd-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

      - name: Tag the image as latest
        run: docker buildx imagetools create -t "$IMAGE_REPO:latest" "$IMAGE_REPO:$GITHUB_REF_NAME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/install.yaml "dist/tierd-${GITHUB_REF_NAME#v}.tgz" \
            --repo "$GITHUB_REPOSITORY" --generate-notes
