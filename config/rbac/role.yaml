---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - volumeattributesclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierpolicies
  - volumetierstates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierpolicies/finalizers
  - volumetierstates/finalizers
  verbs:
  - update
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierpolicies/status
  - volumetierstates/status
  verbs:
  - get
  - patch
  - update
