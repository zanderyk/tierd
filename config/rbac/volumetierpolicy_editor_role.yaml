# This rule is not used by the project tierd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the tierd.zanderyk.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tierd
    app.kubernetes.io/managed-by: kustomize
  name: volumetierpolicy-editor-role
rules:
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierpolicies/status
  verbs:
  - get
