# This rule is not used by the project tierd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over tierd.zanderyk.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tierd
    app.kubernetes.io/managed-by: kustomize
  name: volumeiosample-admin-role
rules:
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumeiosamples
  verbs:
  - '*'
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumeiosamples/status
  verbs:
  - get
