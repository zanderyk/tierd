# Headless, so Prometheus scrapes every agent pod rather than one at random.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: tierd
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: agent
  name: agent-metrics
  namespace: system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tierd
    app.kubernetes.io/component: agent
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
