kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: volumetierpolicies.tierd.zanderyk.github.io
spec:
  group: tierd.zanderyk.github.io
  names:
    kind: VolumeTierPolicy
    listKind: VolumeTierPolicyList
    plural: volumetierpolicies
    shortNames:
    - vtp
    singular: volumetierpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Conflict')].status
      name: Conflict
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: VolumeTierPolicy is the Schema for the volumetierpolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of VolumeTierPolicy
            properties:
              mode:
                default: Recommend
                description: mode decides whether the PVC(s) will be patched or reported
                  on.
                enum:
                - Recommend
                - Act
                type: string
              scaleDown:
                description: |-
                  scaleDown defines when a PVC moves to the next lower tier.
                  If unset, the policy never scales down.
                properties:
                  for:
                    default: 24h
                    description: |-
                      For is how long the conditions must hold before scaling down. Keep it
                      much longer than scaleUp.for to avoid flapping.
                    type: string
                  ioPressureBelow:
                    default: 1
                    description: |-
                      ioPressureBelow additionally requires I/O pressure (PSI "some" avg60,
                      in percent) to stay below this value.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  utilizationBelow:
                    description: |-
                      utilizationBelow allows a scale-down when usage stays below this
                      percentage of the next lower tier's declared ceilings, so the volume
                      would still fit after moving. If that tier has no ceilings, device
                      utilization (busy time) is used instead.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - utilizationBelow
                type: object
              scaleUp:
                description: scaleUp defines when a PVC moves to the next higher tier.
                properties:
                  for:
                    default: 10m
                    description: for is how long a trigger must hold continuously
                      before scaling up.
                    type: string
                  ioPressureAbove:
                    description: |-
                      ioPressureAbove triggers a scale-up when the pod's I/O pressure
                      (PSI "some" avg60, in percent) exceeds this value.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  latencyP95AboveMs:
                    description: |-
                      latencyP95AboveMs triggers a scale-up when p95 I/O latency on the
                      volume exceeds this many milliseconds.
                    format: int64
                    minimum: 1
                    type: integer
                  utilizationAbove:
                    description: |-
                      utilizationAbove triggers a scale-up when usage exceeds this percentage
                      of the current tier's declared ceilings. Ignored for tiers without
                      ceilings.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: at least one of ioPressureAbove, latencyP95AboveMs or utilizationAbove
                    must be set
                  rule: has(self.ioPressureAbove) || has(self.latencyP95AboveMs) ||
                    has(self.utilizationAbove)
              selector:
                description: |-
                  selector decides which PVCs a VolumeTierPolicy manages. If empty,
                  all PVCs in the namespace will be selected.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              tiers:
                description: |-
                  tiers are the ordered list of performance levels a policy can move a PVC
                  between, from lowest to highest.
                items:
                  properties:
                    ceilings:
                      description: ceilings optionally declares this tier's performance
                        limits. If unset, saturation is inferred from latency and
                        I/O pressure.
                      properties:
                        iops:
                          description: iops is the tier's maximum IOPS.
                          format: int64
                          minimum: 1
                          type: integer
                        throughputMiBps:
                          description: throughputMiBps is the tier's maximum throughput
                            in MiB/s.
                          format: int64
                          minimum: 1
                          type: integer
                      type: object
                    name:
                      description: vacName is the name of the VolumeAttributesClass.
                      type: string
                  required:
                  - name
                  type: object
                minItems: 2
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - mode
            - scaleUp
            - selector
            - tiers
            type: object
            x-kubernetes-validations:
            - message: scaleDown.utilizationBelow must be lower than scaleUp.utilizationAbove
              rule: '!has(self.scaleDown) || !has(self.scaleUp.utilizationAbove) ||
                self.scaleDown.utilizationBelow < self.scaleUp.utilizationAbove'
          status:
            description: status defines the observed state of VolumeTierPolicy
            properties:
              conditions:
                description: |-
                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              pvcs:
                description: pvcs is a list of PVCs this policy has matched.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
