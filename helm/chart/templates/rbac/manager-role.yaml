apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "tierd.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  - volumeattributesclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumeiosamples
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierpolicies
  - volumetierstates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierpolicies/finalizers
  - volumetierstates/finalizers
  verbs:
  - update
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierpolicies/status
  - volumetierstates/status
  verbs:
  - get
  - patch
  - update
