apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "tierd.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "tierd.resourceName" (dict "suffix" "agent-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  verbs:
  - get
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumetierstates
  verbs:
  - get
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumeiosamples
  verbs:
  - get
  - create
  - delete
- apiGroups:
  - tierd.zanderyk.github.io
  resources:
  - volumeiosamples/status
  verbs:
  - patch
