{{- /*
Hand-written: the helm plugin drops the agent's ServiceAccount and generates
a static DaemonSet, so the agent's templates live here. `make helm-chart`
deletes the plugin's copies in templates/extras.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "tierd.agentLabels" . | nindent 4 }}
  name: {{ include "tierd.resourceName" (dict "suffix" "agent" "context" $) }}
  namespace: {{ .Release.Namespace }}
