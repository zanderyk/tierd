allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  labels:
    addonmanager.kubernetes.io/mode: EnsureExists
    kubernetes.io/cluster-service: "true"
  name: azurefile-csi-premium-nfs
mountOptions:
- nconnect=4
- actimeo=30
- noresvport
parameters:
  skuName: PremiumV2_LRS
  protocol: nfs
provisioner: file.csi.azure.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: tierd-test3
  name: files-nfs
  namespace: tierd-test
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: azurefile-csi-premium-nfs
  volumeMode: Filesystem
---
apiVersion: v1
kind: Pod
metadata:
  name: files-writer-nfs
  namespace: tierd-test
spec:
  containers:
  - name: w
    image: busybox:1.36
    command: ["sh", "-c", "while true; do dd if=/dev/zero of=/data/f
bs=1M count=50 2>/dev/null; sleep 5; done"]
    volumeMounts: [{name: d, mountPath: /data}]
  volumes:
  - name: d
    persistentVolumeClaim: {claimName: files-nfs}