apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: raw, namespace: tierd-test, labels: {app: tierd-test3}}
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Block
  storageClassName: managed-csi-premium-v2
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: raw-fio, namespace: tierd-test}
spec:
  containers:
  - name: fio
    image: alpine:3.20
    command: ["sh", "-c", "apk add -q fio && fio --name=w --filename=/dev/xvda --rw=randwrite --bs=4k --iodepth=16 --ioengine=libaio --direct=1 --time_based --runtime=24h"]
    volumeDevices: [{name: d, devicePath: /dev/xvda}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: raw}}]